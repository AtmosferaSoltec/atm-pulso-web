# Despliegue directo con atm-deploy (Mac -> VPS, sin GitHub Actions). Ver ../../tools/atm-deploy.
# Las mismas URLs que pasa el workflow como build-args; el .env local nunca entra al build.
APP_DIR=/opt/pulso-web
PREBUILT=builder

fast_checks() { pnpm lint; }

fast_build() {
	VITE_API_URL=https://pulso-api.atmosferast.com/api/v1 \
		VITE_AUTH_API_URL=https://auth.atmosferast.com \
		pnpm build
	copy_out dist builder/app/dist
}
