# nginx of the web container. The host nginx (TLS, the domain) proxies here.
#
# The admin app lives under /app/ (Vite `base`), the files under html/app. The root of the domain is the
# public landing, another container (atm-pulso-landing); the host nginx sends only /app and /kiosk here.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Vite emits hashed file names under /app/assets: they never change.
    location /app/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.inc;
        try_files $uri =404;
    }

    # Every other route under /app/ is the app (it routes by hash; the kiosk is /app/kiosk). index.html is
    # never cached so a new deploy shows up on the next visit, and the app is never indexed.
    location /app/ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/security-headers.inc;
        try_files $uri /app/index.html;
    }

    location = /app {
        return 301 /app/;
    }

    # Old addresses, from before the landing: the kiosk tablets and bookmarks of the root.
    location = /kiosk {
        return 301 /app/kiosk;
    }
    location / {
        return 301 /app/;
    }
}
