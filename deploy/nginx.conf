# nginx of the web container. The host nginx (TLS, the domain) proxies here.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Vite emits hashed file names under /assets: they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.inc;
        try_files $uri =404;
    }

    # Every other route is the app; index.html is never cached so a new deploy
    # shows up on the next visit.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.inc;
        try_files $uri $uri/ /index.html;
    }
}
